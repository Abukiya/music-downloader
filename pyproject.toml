[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-download"
version = "0.1.0"
description = "A portable command-line wrapper for downloading YouTube audio with yt-dlp"
requires-python = ">=3.9"
dependencies = ["yt-dlp>=2024.1.1"]

[project.scripts]
music-download = "music_download.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
